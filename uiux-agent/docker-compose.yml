# Tier 1 Docker Compose — UI/UX Refactor Agent + MongoDB
# Based on agentos-docker-template with the db service swapped for Mongo.
#
# Usage:
#   docker compose up -d --build
#   # Confirm at http://localhost:7777/docs
#   # Control Plane: os.agno.com → Add new OS → Local → http://localhost:7777
#   docker compose down          # stop; add -v to wipe session/trace data

services:
  agentos:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["7777:7777"]
    environment:
      - MONGO_DB_URL=mongodb://agno:agno@mongo:27017
      - MONGO_DB_NAME=agno
      - AGNO_TELEMETRY=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRONG_MODEL=${STRONG_MODEL:-claude-sonnet-4-20250514}
      - SMALL_MODEL=${SMALL_MODEL:-claude-haiku-3-20240307}
      - TARGET_REPO_ROOT=/app/target-repo
      - AGENTOS_PORT=7777
    volumes:
      - ./:/app                         # Live-reload during dev
      - target-repo:/app/target-repo:ro # Mount the Connector source read-only
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=agno
      - MONGO_INITDB_ROOT_PASSWORD=agno
    volumes:
      - mongodata:/data/db
    # Bind to localhost only — no external access.
    # In production, use Atlas or VPC-internal replica set instead.
    ports: ["27017:27017"]

volumes:
  mongodata:
  target-repo:
