# Standalone development worker. The root compose stack also wires Connector.
services:
  uiux-agent:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      DEPLAI_SERVICE_KEY: ${DEPLAI_SERVICE_KEY:?Set DEPLAI_SERVICE_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      UIUX_OPENROUTER_MODEL: ${UIUX_OPENROUTER_MODEL:-}
      UIUX_RUN_DIRECTORY: /app/data/uiux-runs
      UIUX_CONNECTOR_URL: ${UIUX_CONNECTOR_URL:-http://host.docker.internal:3000}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - uiux_worker_state:/app/data/uiux-runs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import Request,urlopen; urlopen(Request('http://127.0.0.1:7777/uiux/health',headers={'X-API-Key':os.environ['DEPLAI_SERVICE_KEY']}),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uiux_worker_state:
