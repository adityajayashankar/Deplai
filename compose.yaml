name: deplai-local

# One-command local stack. From the repository root run:
#   docker compose up --build
#
# It starts the Connector UI, Agentic Layer, customization backend, and MySQL.
# GitHub OAuth/App and LLM functionality remains inactive
# until real credentials are supplied as environment variables.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: deplai
      MYSQL_USER: deplai
      MYSQL_PASSWORD: deplai-local-password
      MYSQL_ROOT_PASSWORD: deplai-local-root-password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Connector/database.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udeplai -pdeplai-local-password --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  connector:
    build:
      context: .
      dockerfile: Connector/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_AGENTIC_WS_URL: ws://localhost:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The OAuth routes also need this at runtime to build callback URLs.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Used by the runtime WebSocket config fallback as well as the client build.
      NEXT_PUBLIC_AGENTIC_WS_URL: ws://localhost:8000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: deplai
      DB_USER: deplai
      DB_PASSWORD: deplai-local-password
      AGENTIC_LAYER_URL: http://agentic-layer:8000
      CUSTOMIZATION_AGENT_BASE_URL: http://customization:8010
      CUSTOMIZATION_BACKEND_URL: http://customization:8010
      DEPLAI_SERVICE_KEY: ${DEPLAI_SERVICE_KEY:-local-only-service-key-change-before-production}
      WS_TOKEN_SECRET: ${WS_TOKEN_SECRET:-local-only-websocket-secret-change-before-production}
      SESSION_SECRET: local-only-session-secret-change-before-production
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@local.test}
      ADMIN_ACCESS_KEY: local-only-admin-key-change-before-production
      BILLING_ENFORCEMENT: ${BILLING_ENFORCEMENT:-false}
      NEXT_PUBLIC_BILLING_ENFORCEMENT: ${NEXT_PUBLIC_BILLING_ENFORCEMENT:-false}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-razorpay}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-test}
      PAYMENTS_TEST_AMOUNT_OVERRIDE: ${PAYMENTS_TEST_AMOUNT_OVERRIDE:-true}
      PAYMENTS_TEST_AMOUNT_PAISE: ${PAYMENTS_TEST_AMOUNT_PAISE:-100}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AI_PLATFORM_ENABLED: ${AI_PLATFORM_ENABLED:-true}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-local-only-session-secret-change-before-production}
      DEPLAI_AI_GATEWAY_URL: http://127.0.0.1:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # Dummy values let the UI start. Replace all GitHub variables to enable
      # sign-in, GitHub App installation, cloning, and PR creation locally.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-local-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-local-client-secret}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-not-configured}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - "3000:3000"
    volumes:
      - ./Connector/tmp/repos:/app/tmp/repos
      - ./Connector/tmp/local-projects:/app/tmp/local-projects
    depends_on:
      mysql:
        condition: service_healthy

  agentic-layer:
    build:
      context: .
      dockerfile: Agentic Layer/Dockerfile
    restart: unless-stopped
    # Local-only convenience: root is used solely so the service can reach the
    # Docker Desktop socket without requiring host-specific group-ID setup.
    # Production uses the non-root service in docker-compose.production.yml.
    user: "0:0"
    environment:
      APP_ENV: development
      DEPLAI_SERVICE_KEY: ${DEPLAI_SERVICE_KEY:-local-only-service-key-change-before-production}
      WS_TOKEN_SECRET: ${WS_TOKEN_SECRET:-local-only-websocket-secret-change-before-production}
      CORS_ORIGINS: http://localhost:3000
      DEPLAI_AI_GATEWAY_URL: ${DEPLAI_AI_GATEWAY_URL:-http://host.docker.internal:3000}
      AI_PLATFORM_ENABLED: ${AI_PLATFORM_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_PLATFORM_UPSTREAM_OPENROUTER: ${AI_PLATFORM_UPSTREAM_OPENROUTER:-true}
      REMEDIATION_OPENROUTER_MODEL: ${REMEDIATION_OPENROUTER_MODEL:-z-ai/glm-5.2:free}
      REMEDIATION_OPENROUTER_PLANNER_MAX_TOKENS: ${REMEDIATION_OPENROUTER_PLANNER_MAX_TOKENS:-512}
      REMEDIATION_OPENROUTER_IMPLEMENTOR_MAX_TOKENS: ${REMEDIATION_OPENROUTER_IMPLEMENTOR_MAX_TOKENS:-1800}
      REMEDIATION_LOCAL_REVIEW_MIN_SCORE: ${REMEDIATION_LOCAL_REVIEW_MIN_SCORE:-80}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-deplai-agentic}
      # Optional Atlas journal. The service remains usable without MongoDB.
      MONGODB_URI: ${MONGODB_URI:-}
      REMEDIATION_MONGODB_DATABASE: ${REMEDIATION_MONGODB_DATABASE:-deplai_security}
      REMEDIATION_MONGODB_RETENTION_DAYS: ${REMEDIATION_MONGODB_RETENTION_DAYS:-30}
      # Checkpoints persist curated source context. Keep both false until the
      # Atlas project and retention policy are explicitly approved.
      REMEDIATION_MONGODB_CHECKPOINTS: ${REMEDIATION_MONGODB_CHECKPOINTS:-false}
      REMEDIATION_MONGODB_PERSIST_CONTEXT: ${REMEDIATION_MONGODB_PERSIST_CONTEXT:-false}
      DEPLAI_LOCAL_PROJECTS_ROOT: /local-projects
      DEPLAI_GITHUB_REPOS_ROOT: /repos
      IAC_WORKSPACE_ROOT: /workspace/iac-workspaces
      ALLOW_GLOBAL_CLEANUP: "false"
    ports:
      - "8000:8000"
    # This user-facing stack must keep long-running scan/remediation WebSockets
    # alive.  Use docker-compose.dev.yml when intentional backend hot reload is
    # needed; Uvicorn reload terminates active WebSockets with browser code 1006.
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    volumes:
      - "./Agentic Layer:/workspace/Agentic Layer"
      - "./remediation_pipeline:/workspace/remediation_pipeline"
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Connector/tmp/local-projects:/local-projects:ro
      - ./Connector/tmp/repos:/repos:ro
      - agentic_runtime:/workspace/runtime
      - iac_workspaces:/workspace/iac-workspaces
      - codebase_deplai:/var/lib/deplai/codebase:ro
      - security_reports:/var/lib/deplai/security-reports:ro
      - llm_output:/var/lib/deplai/llm-output:ro
      - grype_db_cache:/var/lib/deplai/grype-db:ro
    tmpfs:
      - /tmp:size=2g,mode=1777
  customization:
    build:
      context: .
      dockerfile: Customization Agent/tenant_builder_app/backend/Dockerfile
    restart: unless-stopped
    # Local-only: root can install preview dependencies into the bind-mounted
    # Connector clone tree. Production compose keeps the non-root user.
    user: "0:0"
    environment:
      APP_ENV: development
      CUSTOMIZATION_PREVIEW_HOST: 127.0.0.1
      CUSTOMIZATION_PREVIEW_AUTO_INSTALL: "1"
      DEPLAI_AI_GATEWAY_URL: ${DEPLAI_AI_GATEWAY_URL:-http://host.docker.internal:3000}
      AI_PLATFORM_ENABLED: ${AI_PLATFORM_ENABLED:-true}
      DEPLAI_SERVICE_KEY: local-only-service-key-change-before-production
    ports:
      - "8010:8010"
    volumes:
      - ./Connector/tmp/repos:/app/tmp/repos
      - ./Connector/tmp/local-projects:/app/tmp/local-projects
      - customization_state:/app/tenant_builder_app/backend/tenants
      - customization_logs:/app/tenant_builder_app/backend/logs
      - "./Customization Agent/tenant_builder_app/backend:/app/tenant_builder_app/backend"

volumes:
  mysql_data:
  github_repos:
  local_projects:
  agentic_runtime:
  iac_workspaces:
  customization_state:
  customization_logs:
  # The Agentic Layer Docker SDK refers to these exact volume names.
  codebase_deplai:
    name: codebase_deplai
  security_reports:
    name: security_reports
  llm_output:
    name: LLM_Output
  grype_db_cache:
    name: grype_db_cache
