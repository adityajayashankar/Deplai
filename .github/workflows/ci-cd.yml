name: DeplAI CI/CD

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deplai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

jobs:
  connector:
    name: Connector checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Connector
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Connector/package-lock.json
      - run: npm ci
      - name: Lint changed Connector files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" == "${GITHUB_SHA}" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          mapfile -t changed < <(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            'Connector/**/*.js' 'Connector/**/*.jsx' 'Connector/**/*.ts' 'Connector/**/*.tsx' \
            | sed 's#^Connector/##' | while IFS= read -r file; do [[ -f "$GITHUB_WORKSPACE/Connector/$file" ]] && printf '%s\n' "$file"; done)
          if ((${#changed[@]})); then
            npx eslint "${changed[@]}"
          else
            echo 'No changed Connector source files require focused lint.'
          fi
      - run: npx tsc --noEmit --pretty false
      - run: npm run test:organizations
      - run: npm run test:billing
      - run: npm run test:usage
      - run: npm run test:ai-platform
      - run: npm run test:deployment
      - run: npm run test:agentic-websocket
      - run: npm run test:docs
      - name: Build Connector
        env:
          NEXT_PUBLIC_APP_URL: https://ci.invalid
          NEXT_PUBLIC_AGENTIC_WS_URL: wss://ci.invalid/agentic
          NEXT_PUBLIC_BILLING_ENFORCEMENT: 'false'
        run: npm run build

  admin-console:
    name: Admin console checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  agentic:
    name: Agentic and deployment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Agentic Layer/requirements.txt
            Terraform Agent/agent/requirements.txt
            Diagram-Cost-Agent/requirements.txt
      - name: Install Agentic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
          python -m pip install -r "Agentic Layer/requirements.txt" \
            -r "Terraform Agent/agent/requirements.txt" \
            -r "Diagram-Cost-Agent/requirements.txt"
      - name: Run Agentic tests
        run: python -m unittest discover -s "Agentic Layer" -p 'test_*.py'
      - name: Run deployment and preflight tests
        run: python -m unittest discover -s deploy -p 'test_*.py'

  customization:
    name: Customization backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Customization Agent/tenant_builder_app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Customization Agent/tenant_builder_app/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  uiux:
    name: UI/UX worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uiux-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uiux-agent/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - run: terraform fmt -check -recursive "Terraform Agent/agent/templates"

  compose:
    name: Production Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provide non-secret Compose validation environment
        run: |
          cp deploy/.env.example deploy/.env
          cat >> deploy/.env <<'EOF'
          ADMIN_SESSION_SECRET=ci-validation-admin-session
          ADMIN_AUDIT_HMAC_SECRET=ci-validation-admin-audit
          ADMIN_MFA_ENCRYPTION_KEY=ci-validation-admin-mfa
          EOF
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env -f docker-compose.production.yml config --quiet
      - name: Validate deployment preflight tests
        run: python -m pip install pyyaml
      - name: Run deployment preflight tests
        run: python -m unittest deploy.test_preflight deploy.test_production_regressions
      - if: always()
        run: rm -f deploy/.env

  deploy-production:
    name: Deploy production
    needs:
      - connector
      - admin-console
      - agentic
      - customization
      - uiux
      - terraform
      - compose
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: deplai-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/deplai/Deplai' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || { echo 'Missing production variable AWS_DEPLOY_ROLE_ARN'; exit 1; }
          test -n "$DEPLOY_INSTANCE_ID" || { echo 'Missing production variable DEPLOY_INSTANCE_ID'; exit 1; }
          test -n "$APP_DOMAIN" || { echo 'Missing production variable APP_DOMAIN'; exit 1; }
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: deplai-github-${{ github.run_id }}
      - name: Deploy exact commit through SSM
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_command="cd -- $(printf '%q' "$DEPLOY_APP_DIR") && GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin $(printf '%q' "$DEPLOY_COMMIT") >/dev/null && git show $(printf '%q' "$DEPLOY_COMMIT"):deploy/remote-deploy.sh | bash -s -- $(printf '%q' "$DEPLOY_COMMIT")"
          parameters="$(jq -cn --arg command "$remote_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "DeplAI deployment $DEPLOY_COMMIT" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command started: $command_id"
          deadline=$((SECONDS + 5400))
          command_status=""
          while (( SECONDS < deadline )); do
            command_status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || true)"
            case "$command_status" in
              Success) break ;;
              Cancelled|Cancelling|Failed|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
          test "$command_status" = Success
